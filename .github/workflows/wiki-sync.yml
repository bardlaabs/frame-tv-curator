name: Sync docs to wiki

# Copies the manual in docs/ to the GitHub wiki whenever docs change on main.
# Needs the wiki to exist (create the first page once in the GitHub web UI).

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/wiki-sync.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy pages
        run: |
          rm -rf wiki/*.md wiki/images
          cp main/docs/*.md wiki/
          [ -d main/docs/images ] && cp -r main/docs/images wiki/images
          # wiki links have no .md extension
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' wiki/*.md
          # sidebar in reading order (same order as the table on Home); any page not listed goes at the end
          order="Features Getting-Started Library Display-and-Look Display-Defaults Settings-Reference Rotation-and-Schedules TV-Tab Optional-Ambient Optional-Presence Discover Optional-Extras Sidecar-Files Troubleshooting"
          {
            echo "**[Home](Home)**"; echo
            for n in $order; do
              [ -f "wiki/$n.md" ] && echo "- [${n//-/ }]($n)"
            done
            for f in wiki/*.md; do
              n=$(basename "$f" .md)
              case " Home _Sidebar $order " in *" $n "*) continue;; esac
              echo "- [${n//-/ }]($n)"
            done
          } > wiki/_Sidebar.md
      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Sync docs from ${GITHUB_SHA::7}"
          git push
