name: Frame TV Curator
version: "0.12.1"
slug: frame_tv_curator
description: Curate, render and rotate art and photos on a Samsung Frame TV
url: https://github.com/bardlaabs/frame-tv-curator
arch: [aarch64, amd64]
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:image-frame
panel_title: Frame Curator
map:
  - media:rw
services:
  - mqtt:want
hassio_api: true
homeassistant_api: true
options:
  log_level: info
  tv_ip: ""
  dry_run: false
schema:
  log_level: list(debug|info|warning|error)
  tv_ip: str?
  dry_run: bool?
