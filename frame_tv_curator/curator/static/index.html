<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame TV Curator</title>
<style>
:root{--bg:#121212;--panel:#1c1c1e;--panel2:#26262a;--line:#34343a;--fg:#f1efe9;--mut:#a6a49d;--acc:#e0b15a;--bad:#e5726a;--ok:#7fc58b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 "Kumbh Sans",system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--panel2);color:var(--fg)}
main{padding:18px;max-width:1500px;margin:0 auto}
button,.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
input,select,textarea{background:#101012;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
input[type=color]{padding:0;width:44px;height:30px}
#upl{font-size:13px;margin:-6px 0 12px}#upl div{padding:2px 0}#upl .ok{color:var(--ok)}#upl .err{color:var(--bad)}#upl .w{color:#f0b35a}input[type=range]{padding:0;vertical-align:middle}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}.row>label{min-width:140px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.tile:hover{border-color:var(--acc)}.tile img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.tile .t{padding:8px 10px}.tile .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tile .t span{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tile.ex{opacity:.45}.badges{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.badges i{font-style:normal;background:#000a;border-radius:6px;padding:1px 6px;font-size:12px}
.tile.cur{outline:2px solid var(--acc)}
.badges{align-items:center}.fb{font-style:normal;background:#000a;border:1px solid #fff4;color:#ddd;border-radius:6px;width:26px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;opacity:0;transition:opacity .12s}
.fb svg{width:16px;height:16px}.tile:hover .fb,.fb.on{opacity:1}.fb:hover{border-color:#fff;color:#fff}
.fb.on.fav{color:#ffc928;border-color:#ffc928;background:#5a4300cc}.fb.on.more{color:#4ade80;border-color:#4ade80;background:#0b4a2acc}.fb.on.exc{color:#ff7b72;border-color:#ff7b72;background:#5a1410cc}
@media (hover:none){.fb{opacity:.75}}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tvwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}.tvside{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
@media(max-width:1000px){.tvwrap{grid-template-columns:1fr}.tvside{position:static;max-height:none;order:-1}}
.stat{display:grid;grid-template-columns:104px 1fr;gap:10px 12px;margin:6px 0 12px}.stat .k{color:var(--mut);font-size:13px;padding-top:2px}
.stat .v{font-weight:600;overflow-wrap:anywhere}.stat .d{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:1px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);margin-right:6px}.pill.ok{background:#25422d;color:var(--ok);border-color:#2f5a3a}.pill.off{color:var(--mut)}.pill.bad{background:#4a2623;color:var(--bad);border-color:#6a3430}
.ent{color:var(--acc);font-weight:700}.num{color:var(--fg);font-weight:700}.stat .d .ent{color:var(--acc)}.cbl .n{font-weight:600}.cbl .i{color:var(--mut);font-size:12px;display:block}
.cbw{position:relative;display:inline-block;max-width:100%}.cbl{position:absolute;left:0;top:100%;z-index:30;min-width:100%;width:max(100%,420px);max-height:280px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0009;margin-top:2px}
.cbl div{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}.cbl div:hover,.cbl div.sel{background:#3a3a40}.cbl small{color:var(--mut)}.cbl mark{background:none;color:var(--acc);font-weight:700}
.chip{padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}.chip.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:700}
.hero img{width:100%;max-width:960px;border-radius:0;display:block;background:#000}
.mut{color:var(--mut)}.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2)}
.modal{position:fixed;inset:0;background:#000c;z-index:20;display:none;overflow:auto;padding:20px}.modal.on{display:block}
.mbox{max-width:1400px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.pv{position:relative}.pv img{width:100%;border-radius:0;display:block;background:#000;aspect-ratio:16/9}
.pv .sp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0008;border-radius:8px}.pv.busy .sp{display:flex}
.tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:8px 8px 0 0;background:none;color:var(--mut)}.tabs button.on{background:var(--panel2);color:var(--fg)}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw span{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:99px;background:var(--panel2);cursor:pointer;font-size:12px;border:1px solid var(--line)}
.sw span i{width:20px;height:20px;border-radius:50%;display:block;border:1px solid #fff3}
.warn{color:#f0b35a}.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mut);margin-bottom:14px}.drop.over{border-color:var(--acc);color:var(--fg)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:99px;display:none;z-index:50}
.ch{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px;user-select:none}
.ch:hover{border-color:var(--acc)}.ch.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:700}.chips2{display:flex;gap:6px;flex-wrap:wrap}
.pv img{cursor:zoom-in}
.pv img,.hero img{box-shadow:0 0 0 1px #000,0 0 0 3px rgba(255,255,255,.9)}
.now{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}@media(max-width:900px){.now{grid-template-columns:1fr}}
.spin{display:inline-block;width:14px;height:14px;border:3px solid #0004;border-top-color:#1a1a1a;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
#actbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:70;background:var(--acc);color:#1a1a1a;font-weight:700;padding:9px 20px;border-radius:99px;box-shadow:0 4px 18px #0008;display:none}
.tile.sel{outline:4px solid var(--acc);outline-offset:-4px}.dcmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:8px 0}.dcmp .c{background:var(--panel2);border-radius:8px;padding:6px}.dcmp img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}.dcmp .c.new{outline:2px solid var(--acc)}.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:120px}.bar i{display:block;height:100%;background:var(--acc)}
#bulk,#dbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line);box-shadow:0 6px 24px #000a;padding:10px 14px;border-radius:14px;display:none;gap:8px;flex-wrap:wrap;align-items:center;max-width:96vw}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin:10px 0;font-size:14px}.kv b{color:var(--mut);font-weight:400}
.viewer{position:fixed;inset:0;background:#000;z-index:60;overflow:hidden;touch-action:none;cursor:grab}.viewer.drag{cursor:grabbing}
.viewer img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;image-rendering:auto}
.vbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:61;background:#000b;padding:6px;border-radius:99px;align-items:center}
.vbar button{border-radius:99px;padding:5px 14px}.vbar span{padding:0 8px;color:var(--mut);min-width:54px;text-align:center}
textarea{width:100%}fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:6px 12px}legend{color:var(--acc);padding:0 6px;font-size:13px}

.tile .pv{position:absolute;top:6px;left:6px;z-index:2;width:30px;height:30px;padding:0;border-radius:8px;background:#000a;border:1px solid #fff4;color:#fff;font-size:16px;line-height:1;opacity:0;transition:opacity .15s}.tile:hover .pv{opacity:1}.tile .pv:hover{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
.tile .ck{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#1a1a1a;font-weight:900;display:flex;align-items:center;justify-content:center}
.adlg{min-width:min(560px,86vw)}.ahead{display:flex;gap:14px;align-items:center;margin-bottom:12px}.aico{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#e0b15a,#d8745f);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}.acnt{color:var(--mut);font-size:13px}
.abar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}.abar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0b15a,#e5726a);transition:width .4s}.abar.sm{height:6px;margin-top:6px}.abar.sm i{background:linear-gradient(90deg,#5fa8d3,#7fc58b)}
.arows{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}.arow{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:10px;padding:8px;border-left:4px solid var(--line)}.arow img{width:84px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000}.arow .ainfo{flex:1;min-width:0}.arow .ainfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow.downloading{border-left-color:#5fa8d3}.arow.done{border-left-color:var(--ok)}.arow.skipped{border-left-color:#e5a24a}.arow.failed{border-left-color:var(--bad)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#444;color:#fff;white-space:nowrap}.pill.downloading,.pill.saving{background:#2f6f94}.pill.done{background:#2f7a42}.pill.skipped{background:#9a6a1c}.pill.failed{background:#a33b34}.pill.queued{background:#444}
.pvx{position:fixed;inset:0;z-index:90;background:#000e;display:flex;gap:0;outline:none}.pvimg{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;min-width:0}.pvimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 50px #000}
.pvside{width:min(400px,40vw);background:var(--panel);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px;overflow:auto}.pva{color:var(--acc);font-weight:700}.pvb{background:var(--panel2);border-radius:10px;padding:8px 12px}.pkv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}.pkv:last-child{border:0}.pkv span{color:var(--mut)}.pvd{color:var(--fg);line-height:1.5;font-size:14px}.pvdup{background:#4a3a14;color:#f0b35a;border-radius:8px;padding:8px 10px;font-size:13px}
@media(max-width:800px){.pvx{flex-direction:column}.pvside{width:auto;max-height:50vh}}
.now>*{min-width:0}#details{overflow-wrap:anywhere}.nsub{color:var(--acc);font-weight:700;margin-bottom:10px}.nstack{display:flex;flex-direction:column;gap:10px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.nb.empty{opacity:.6;cursor:pointer}.nb.empty .nv{color:var(--mut);font-style:italic}.nb.empty:hover{opacity:1;outline:1px dashed var(--acc)}.nb{background:var(--panel2);border-radius:8px;padding:7px 10px;min-width:0}.nk{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}.nv{font-size:14px;line-height:1.45;overflow-wrap:anywhere}.nv a{color:var(--acc)}.nfacts{color:var(--mut);font-size:12px;line-height:1.5}
.lcol{min-width:0}
</style></head><body>
<header><h1>Frame TV Curator</h1>
<nav><button data-t="now" class="on">Now Playing</button><button data-t="lib">Library</button><button data-t="disc">Discover</button><button data-t="disp">Display</button><button data-t="sched">Schedules</button><button data-t="tv">TV</button><button data-t="set">Settings</button></nav>
<span style="flex:1"></span><span id="tvs" class="pill mut"></span></header>
<main>
<section id="t-now"></section><section id="t-lib" hidden></section><section id="t-disc" hidden></section><section id="t-disp" hidden></section><section id="t-sched" hidden></section><section id="t-tv" hidden></section><section id="t-set" hidden></section>
</main>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div><div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const api=async(p,body,m)=>{const r=await fetch('api/'+p,body===undefined?{}:{method:m||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){const tx=(await r.text())||r.status;try{clog('API '+p+' failed: '+String(tx).slice(0,300))}catch(e){}throw new Error(tx)};const t=r.headers.get('content-type')||'';return t.includes('json')?r.json():r.blob()};
function toast(m,ms=2500){if(/fail|error|could not|did not|didn.t|problem|not running|not found/i.test(String(m)))try{clog('popup: '+m)}catch(e){}const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
function fillKids(e,...k){e.replaceChildren(...k.flat().filter(x=>x!=null&&x!==false))}
{const _flat=n=>n.flat(Infinity).filter(x=>x!=null&&x!==false);
for(const m of['replaceChildren','append','prepend']){const o=Element.prototype[m];Element.prototype[m]=function(...n){return o.apply(this,_flat(n))}}}
function el(tag,at={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(at)){if(k=='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k=='html')e.innerHTML=v;else if(typeof v=='boolean'){if(v)e.setAttribute(k,'');}else e.setAttribute(k,v)}
 for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e}
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>a=a[k]??={});a[ks.at(-1)]=v};
const dm=(a,b)=>{const o=JSON.parse(JSON.stringify(a||{}));for(const[k,v]of Object.entries(b||{}))o[k]=(v&&typeof v=='object'&&!Array.isArray(v)&&typeof o[k]=='object'&&o[k])?dm(o[k],v):JSON.parse(JSON.stringify(v));return o};
const clone=o=>JSON.parse(JSON.stringify(o));
const dbounce=(f,ms)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>f(...a),ms)}};

/* ---------- generic bound field ---------- */
let PICKID=null,PALETTE=[];const PALHOSTS=[];
function fillPal(box,setVal){box.replaceChildren(...PALETTE.map(c=>el('span',{title:c.color+' · '+c.pct+'% of the picture',style:'width:30px;height:30px;border-radius:6px;border:1px solid #0008;cursor:pointer;background:'+c.color,onclick:()=>setVal(c.color,true)})));
 if(!PALETTE.length)box.textContent=PICKID?'Loading picture colors…':'Open a picture’s editor to pick colors from that picture.'}
function setPalette(id,list){PICKID=id;PALETTE=list}
function field(label,obj,path,kind,o={},onch){
 const cur=get(obj,path);let inp;
 const ch=v=>{set(obj,path,v);onch&&onch(path)};
 if(kind=='check'){inp=el('input',{type:'checkbox'});inp.checked=!!cur;inp.onchange=()=>ch(inp.checked)}
 else if(kind=='select'&&Object.keys(o.options).length<=6&&!o.native){const g=el('div',{class:'chips2'});const mk=()=>g.replaceChildren(...Object.entries(o.options).map(([v,l])=>el('span',{class:'ch'+(String(get(obj,path))==v?' on':''),onclick:()=>{ch(v);mk()}},l)));mk();inp=g}
 else if(kind=='select'){inp=el('select',{},Object.entries(o.options).map(([v,l])=>el('option',{value:v},l)));inp.value=cur;inp.onchange=()=>ch(inp.value)}
 else if(kind=='range'){const out=el('span',{class:'mut'},cur);const r=el('input',{type:'range',min:o.min,max:o.max,step:o.step||1});r.value=cur;
   r.oninput=()=>{out.textContent=r.value};r.onchange=()=>ch(+r.value);inp=el('span',{},r,' ',out)}
 else if(kind=='num'){inp=el('input',{type:'number',min:o.min,max:o.max,step:o.step||1,style:'width:90px'});inp.value=cur;inp.onchange=()=>ch(+inp.value)}
 else if(kind=='color'){ // in-page picker: the native one (macOS "Show Colors" panel) breaks inside the HA app web view
  const isHex=v=>/^#[0-9a-f]{6}$/i.test(v);let val=isHex(cur)?cur:'#efece4';
  const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
  const toHsl=h=>{const[r,g,b]=rgb(h),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let H=0,S=0;
   if(d){S=d/(1-Math.abs(2*l-1));H=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;H=(H*60+360)%360}return[H,S*100,l*100]};
  const toHex=(H,S,L)=>{S/=100;L/=100;const c=(1-Math.abs(2*L-1))*S,x=c*(1-Math.abs((H/60)%2-1)),m=L-c/2;
   const[r,g,b]=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];
   return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('')};
  const sw=el('span',{title:'Click to choose a color',style:'display:inline-block;width:44px;height:30px;border:1px solid var(--line);border-radius:6px;vertical-align:middle;cursor:pointer'});
  const tx=el('input',{type:'text',maxLength:7,style:'width:84px;margin-left:8px;font-family:monospace'});
  const sl=(max,bg)=>el('input',{type:'range',min:0,max,step:1,style:'width:200px'});
  const sH=sl(359),sS=sl(100),sL=sl(100);
  const panel=el('div',{style:'display:none;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)'});
  const row=(n,i)=>el('div',{class:'row',style:'margin:2px 0'},el('label',{style:'width:70px'},n),i);
  const PAL=['#ffffff','#f5f1e8','#efece4','#e3dccb','#cfc6b2','#a89f8c','#7d776b','#4a4640','#2b2b2b','#111111','#1f2a44','#2e4a6b','#2f4a3a','#6b7f5a','#5a2a2a','#8c3b3b','#7a5c3a','#a89060','#6b7f8f','#c9a227'];

  C.mode=='entity'?entityField('Entity with a color temperature',C,'entity','switch,light,sensor,input_number,number',{ph:'switch.adaptive_lighting_living_room'}):null,
  C.mode=='entity'?el('p',{class:'mut'},'Reads color_temp_kelvin (or color_temp in mireds, or a plain number) from the entity — the Adaptive Lighting switch provides it. Unavailable? It falls back to the sun, then the fixed value.'):null,
  C.mode=='sun'||C.mode=='entity'?entityField('Sun entity',C,'sun_entity','sun',{ph:'sun.sun'}):null,
  C.mode!='off'?el('fieldset',{},el('legend',{},'Map to the TV’s scale'),
    num('Warmest setting (K)',C,'low_k',1500,6000,100),num('Coolest setting (K)',C,'high_k',3000,10000,100),field('Flip direction',C,'flip','check'),
    el('p',{class:'mut'},'The TV only has a simple warm⇄cool slider. These test buttons move the TV’s art color tone to its two ends so you can see which is warm. If the “high end” looks warmer, tick Flip direction.'),
    el('div',{class:'row'},...[['min','Low end'],['max','High end']].map(([w,l])=>el('button',{onclick:async()=>{const p=await api('tv_probe');const r=p.color_temperature;if(!r||r.min==null){toast('TV did not report its range'+(p.error?': '+p.error:''),6000);return}
      const x=await api('tv_apply',{color_temp:w=='min'?r.min:r.max});toast(l+' ('+(w=='min'?r.min:r.max)+'): '+x.message,4000)}},'Test: '+l)),
     el('button',{onclick:async()=>{const p=await api('tv_probe');toast('TV reports: brightness '+JSON.stringify(p.brightness||'?')+' · tone '+JSON.stringify(p.color_temperature||'?')+' · sensor '+(p.sensor??'?'),9000)}},'What does the TV report?'))):null,
  C.mode!='off'?num('Change at most every (seconds)',C,'min_interval_s',30,7200,30):null)};drawC();
 const ct=el('div',{class:'card'},el('h3',{},'Color temperature'),cd);
 // light
 const L=A.light,ld=el('div');
 const drawL=()=>{fillKids(ld,
  entityField('Light (or switch) that follows the TV',L,'entity','light,switch,input_boolean',{ph:'(none)'}),
  field('Turn it on and off with the TV',L,'follow','check'),
  L.entity&&L.follow?field('Match its brightness to the art',L,'sync_brightness','check'):null,
  L.entity&&L.follow&&L.sync_brightness?num('Light at minimum art brightness (%)',L,'light_min_pct',1,100,5):null,
  L.entity&&L.follow&&L.sync_brightness?num('Light at maximum art brightness (%)',L,'light_max_pct',1,100,5):null,
  L.entity&&L.follow?field('Match its color temperature to the art',L,'sync_color_temp','check'):null,
  L.entity?el('div',{class:'row'},el('button',{onclick:()=>api('light_test',{on:true}).then(r=>toast(r.message))},'Test: on'),el('button',{onclick:()=>api('light_test',{on:false}).then(r=>toast(r.message))},'Test: off')):null,
  el('p',{class:'mut'},'The light switches on when the TV turns on (Art Mode or not) and off when it turns off or goes to standby. With nothing chosen, this is off. If another automation or Adaptive Lighting already manages this light, leave the matching options off so they don’t fight.'))};drawL();
 const light=el('div',{class:'card'},el('h3',{},'Light that follows the TV'),ld);
 // presence
 s.presence??={};const P=s.presence;P.entities??=[];const pd=el('div');
 const multiEnt=()=>{const box=el('div',{class:'row'}),chips=el('span'),inp=el('input',{type:'text',placeholder:'Select…'});
  let items=[];
  const draw=()=>fillKids(chips,...P.entities.map((x,i)=>el('span',{class:'chip',title:x},nameOf(x)+' ',el('a',{href:'#',onclick:ev=>{ev.preventDefault();P.entities.splice(i,1);draw()}},'×'))));draw();
  entList('binary_sensor,person,device_tracker,input_boolean').then(l=>{items=l;draw()});
  const cw=combo(inp,()=>items,()=>'',v=>{if(v&&items.some(x=>x.id==v)&&!P.entities.includes(v)){P.entities.push(v);draw()}});
  box.append(el('label',{},'Presence sensors (any one “on” = someone is here)'),chips,cw);return box};
 const tvSel=(label,path)=>{const row=el('div',{class:'row'}),sel=el('select'),ent=P[path];row.append(el('label',{},label));
  if(!ent){row.append(el('span',{class:'mut'},'not set'));return row}
  api('ha_entities?domains=select').then(l=>{const e=l.find(x=>x.id==ent);if(!e){row.append(el('span',{class:'mut'},'⚠ '+ent+' not found'));return}
   api('ha_state?entity='+ent).then(st=>{(st.attributes?.options||[]).forEach(o=>sel.append(el('option',{value:o},o)));sel.value=e.state;
    sel.onchange=async()=>{const r=await api('ha_select',{entity:ent,option:sel.value});toast(label+': '+r.message)};row.append(sel)}).catch(()=>{})});return row};
 const drawP=()=>{fillKids(pd,
  field('Turn the Frame on and off with presence',P,'enabled','check',{},drawP),
  P.enabled?multiEnt():null,
  P.enabled?num('Nobody here for (minutes) before turning off',P,'away_minutes',1,240):null,
  P.enabled?field('When everyone has left',P,'away_action','select',{options:{power_off:'Power the TV off',art_off:'Leave Art Mode (normal TV)'}}):null,
  P.enabled?field('Turn Art Mode on when someone returns',P,'on_return','check'):null,
  P.enabled?field('Only turn off while Art Mode is showing (never interrupt TV)',P,'only_art_mode','check'):null,
  P.enabled?field('Only wake it during these hours (HH:MM-HH:MM, blank = always)',P,'active_hours','text'):null,
  P.enabled?field('Fallback if every sensor is unavailable: assume home during (HH:MM-HH:MM, blank = do nothing)',P,'fallback_hours','text'):null,
  P.enabled?el('p',{class:'mut'},'Short sensor dropouts are ignored: the TV is only turned off after the sensors have read “nobody” continuously for the time above. If no sensor is available, the TV is left alone (or follows the fallback hours). Presence only ever turns the TV on when someone returns after it turned it off, so switching it off by hand while you are in the room stays off.'):null,
  el('h4',{},'The TV’s own motion sensor'),
  tvSel('Motion sensitivity','tv_motion_sensitivity_entity'),tvSel('Motion timer (minutes, off = disabled)','tv_motion_timer_entity'),
  el('p',{class:'mut'},'The Frame has a built-in sensor that dims or turns off the screen when no motion is seen. Use it instead of, or together with, the sensors above. Changes apply to the TV immediately.'))};drawP();
 const pres=el('div',{class:'card'},el('h3',{},'Presence'),pd);

 // live status (shown in a sticky side column)
 entList('');
 const live=el('div',{class:'card'},el('h3',{},'What it is doing now'),el('div',{id:'ambstat',class:'mut'},'…'),
  el('div',{class:'row'},
   el('button',{onclick:async ev=>{const b=ev.currentTarget;b.disabled=true;b.textContent='Refreshing…';await updAmb();b.disabled=false;b.textContent='Refresh status'}},'Refresh status')));
 const act=el('div',{class:'card'},el('div',{class:'row'},el('button',{class:'pri',onclick:async()=>{await api('settings',s);await api('ambient_now',{});toast('Saved and applying…');setTimeout(updAmb,2500)}},'Save & apply now'),el('span',{class:'mut'},'Saves the settings on this tab and applies them to the TV now')));
 const updAmb=async()=>{const e=$('#ambstat');if(!e||$('#t-tv').hidden)return;try{const a=await api('ambient');
   const b=a.brightness||{},c=a.color_temp||{},l=a.light||{},pr=a.presence||{};
   const pill=(txt,cls)=>el('span',{class:'pill '+(cls||'')},txt);
   const row=(k,v,d)=>[el('div',{class:'k'},k),el('div',{class:'v'},v,d?el('span',{class:'d',html:rich(d)}):null)];
   const tvs=a.tv_state,tvp=tvs=='on'?pill('On','ok'):tvs=='off'||tvs=='standby'?pill(tvs=='off'?'Off':'Standby','off'):pill(tvs||'unknown','bad');
   const ctl=(m,main,d)=>m=='off'?[pill('Not controlled','off')]:[main,d];
   const bv=ctl(b.mode,(b.pct??'—')+'%',[b.source,b.applied!=null?'TV set to '+b.applied:null].filter(Boolean).join(' · '));
   const cv=ctl(c.mode,(c.kelvin??'—')+' K',[c.source,c.applied!=null?'TV set to '+c.applied:null].filter(Boolean).join(' · '));
   const pp=!pr.enabled?[pill('Off','off')]:[pr.present==null?pill('Unknown','bad'):pr.present?pill('Someone is here','ok'):pill('Nobody · '+Math.round((pr.away_for_s||0)/60)+' min','bad'),
      [pr.source,pr.last].filter(Boolean).join(' · ')];
   const lv=l.entity?[el('span',{class:'ent'},nameOf(l.entity)),(l.follow?'Follows the TV':'Not following')+(l.last?' · '+l.last:'')]:[pill('None','off')];
   fillKids(e,el('div',{class:'stat'},
     ...row('TV',tvp),...row('Brightness',...bv),...row('Color temp.',...cv),...row('Presence',...pp),...row('Light',...lv)),
    a.error?el('div',{class:'warn'},'Problem: '+humanize(a.error)):null,
    el('div',{class:'mut',style:'font-size:12px'},'Updated '+new Date().toLocaleTimeString()))}catch(x){}};
 if(ambTimer)clearInterval(ambTimer);ambTimer=setInterval(updAmb,5000);setTimeout(updAmb,300);
 return [act,live,conn,pres,bright,ct,light]}
const $$=x=>x;
boot();
